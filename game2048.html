<style>
  .hud{display:flex;gap:12px;align-items:center;justify-content:center;margin-bottom:14px}
  .score{background:var(--card2);border:1px solid var(--line2);border-radius:12px;padding:8px 18px;text-align:center;min-width:92px}
  .score .l{color:var(--muted);font-size:12px;font-weight:700}
  .score .v{font-family:"Baloo Bhaijaan 2",sans-serif;font-size:24px;color:#fff}
  .board2{position:relative;background:#1c1147;border-radius:16px;padding:10px;width:min(92vw,420px);aspect-ratio:1;margin-inline:auto;touch-action:none}
  .g2{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:10px;width:100%;height:100%}
  .cell2{background:rgba(255,255,255,.05);border-radius:11px;display:flex;align-items:center;justify-content:center;
    font-family:"Baloo Bhaijaan 2",sans-serif;font-weight:800;font-size:clamp(20px,6vw,34px);color:#fff;transition:transform .08s}
  .cell2[data-v="2"]{background:#7c3aed}.cell2[data-v="4"]{background:#8b3ff0}.cell2[data-v="8"]{background:#a855f7}
  .cell2[data-v="16"]{background:#c026d3}.cell2[data-v="32"]{background:#db2777}.cell2[data-v="64"]{background:#e11d6b}
  .cell2[data-v="128"]{background:#f43f5e;font-size:clamp(18px,5vw,30px)}.cell2[data-v="256"]{background:#fb7185}
  .cell2[data-v="512"]{background:#f59e0b;color:#3b2c00}.cell2[data-v="1024"]{background:#fbbf24;color:#3b2c00;font-size:clamp(16px,4.5vw,26px)}
  .cell2[data-v="2048"]{background:var(--y);color:#3b2c00;box-shadow:0 0 26px var(--y)}
  .pop{transform:scale(1.12)}
  .overlay{position:absolute;inset:0;background:rgba(20,11,46,.9);border-radius:16px;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px}
  .overlay.show{display:flex}
  .overlay h2{font-family:"Baloo Bhaijaan 2",sans-serif;color:#fff;font-size:30px;margin:0}
  .hint{color:var(--muted);text-align:center;font-size:14px;margin-top:14px}

<main class="gamewrap">
  <div class="crumbs"><a href="index.html">الرئيسية</a> ← ألعاب ذكاء ← 2048</div>
  <div class="gtitle"><h1>2048 🔢</h1><p>ادمج الأرقام المتشابهة للوصول إلى 2048</p></div>

  <div class="ad ad-lead"><span class="lbl">مساحة إعلانية</span></div>

  <div class="hud">
    <div class="score"><div class="l">النقاط</div><div class="v" id="score">0</div></div>
    <div class="score"><div class="l">الأفضل</div><div class="v" id="best">0</div></div>
    <button class="btn" id="newBtn">لعبة جديدة</button>
  </div>

  <div class="board2">
    <div class="g2" id="g2"></div>

<footer class="foot"><div class="fine">© <span id="yr"></span> محظوظ (ma7zooz.com)</div></footer>

<script>
document.getElementById('yr').textContent=new Date().getFullYear();
(function(){
  "use strict";
  var N=4, g2=document.getElementById('g2'), cells=[], board=[], score=0, won=false, over=false;
  var scoreEl=document.getElementById('score'), bestEl=document.getElementById('best'), ov=document.getElementById('ov'), ovt=document.getElementById('ovt');
  var best=0; try{ best=parseInt(localStorage.getItem('m7_2048_best')||'0',10)||0; }catch(e){}
  bestEl.textContent=best;
  for(var i=0;i<N*N;i++){ var c=document.createElement('div'); c.className='cell2'; g2.appendChild(c); cells.push(c); }

  function empty(){ var a=[]; for(var i=0;i<N*N;i++) if(board[i]===0) a.push(i); return a; }
  function spawn(){ var e=empty(); if(!e.length)return; var idx=e[Math.floor(Math.random()*e.length)]; board[idx]=Math.random()<0.9?2:4; cells[idx].classList.add('pop'); }
  function draw(){ for(var i=0;i<N*N;i++){ var v=board[i]; cells[i].textContent=v?v:''; if(v)cells[i].setAttribute('data-v',v); else cells[i].removeAttribute('data-v'); }
    scoreEl.textContent=score; setTimeout(function(){cells.forEach(function(c){c.classList.remove('pop');});},90); }
  function reset(){ board=new Array(N*N).fill(0); score=0; won=false; over=false; ov.classList.remove('show'); spawn(); spawn(); draw(); }

  function getRow(b,r){ var a=[]; for(var c=0;c<N;c++)a.push(b[r*N+c]); return a; }
  function setRow(b,r,a){ for(var c=0;c<N;c++)b[r*N+c]=a[c]; }
  function getCol(b,c){ var a=[]; for(var r=0;r<N;r++)a.push(b[r*N+c]); return a; }
  function setCol(b,c,a){ for(var r=0;r<N;r++)b[r*N+c]=a[r]; }
  function slide(arr){ // slide toward index 0 (left), merge; returns {line, gained}
    var a=arr.filter(function(x){return x!==0;}); var out=[], gained=0;
    for(var i=0;i<a.length;i++){ if(i<a.length-1 && a[i]===a[i+1]){ var m=a[i]*2; out.push(m); gained+=m; if(m===2048)won=true; i++; } else out.push(a[i]); }
    while(out.length<N)out.push(0); return {line:out, gained:gained};
  }
  function move(dir){ // dir: 'l','r','u','d'
    if(over) return;
    var before=board.slice(), gainedTot=0;
    if(dir==='l'||dir==='r'){ for(var r=0;r<N;r++){ var row=getRow(board,r); if(dir==='r')row.reverse(); var s=slide(row); if(dir==='r')s.line.reverse(); setRow(board,r,s.line); gainedTot+=s.gained; } }
    else { for(var c=0;c<N;c++){ var col=getCol(board,c); if(dir==='d')col.reverse(); var s2=slide(col); if(dir==='d')s2.line.reverse(); setCol(board,c,s2.line); gainedTot+=s2.gained; } }
    var changed=before.some(function(v,i){return v!==board[i];});
    if(!changed) return;
    score+=gainedTot;
    if(score>best){ best=score; bestEl.textContent=best; try{localStorage.setItem('m7_2048_best',best);}catch(e){} }
    spawn(); draw();
    if(won){ won=false; over=false; /* allow continue */ ovt.textContent='وصلت إلى 2048! 🎉'; ov.classList.add('show'); }
    else if(!canMove()){ over=true; ovt.textContent='انتهت اللعبة — نقاطك: '+score; ov.classList.add('show'); }
  }
  function canMove(){ if(empty().length)return true;
    for(var r=0;r<N;r++)for(var c=0;c<N;c++){ var v=board[r*N+c]; if(c<N-1&&v===board[r*N+c+1])return true; if(r<N-1&&v===board[(r+1)*N+c])return true; } return false; }

  document.addEventListener('keydown',function(e){
    var k=e.key; var d=null;
    if(k==='ArrowLeft')d='l'; else if(k==='ArrowRight')d='r'; else if(k==='ArrowUp')d='u'; else if(k==='ArrowDown')d='d';
    if(d){ e.preventDefault(); move(d); }
  });
  // touch swipe
  var sx=0,sy=0;
  var bd=document.querySelector('.board2');
  bd.addEventListener('touchstart',function(e){ var t=e.touches[0]; sx=t.clientX; sy=t.clientY; },{passive:true});
  bd.addEventListener('touchend',function(e){ var t=e.changedTouches[0]; var dx=t.clientX-sx, dy=t.clientY-sy;
    if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;
    if(Math.abs(dx)>Math.abs(dy)) move(dx>0?'r':'l'); else move(dy>0?'d':'u'); },{passive:true});
  document.getElementById('newBtn').addEventListener('click',reset);
  document.getElementById('ovBtn').addEventListener('click',reset);
  reset();
})();
</script>
</body>
