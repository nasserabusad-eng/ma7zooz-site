<meta name="keywords" content="لعبة الذاكرة, تطابق البطاقات, ألعاب ذاكرة, ألعاب تركيز, العب مجاناً">
<link rel="canonical" href="https://ma7zooz.com/memory.html">
<meta property="og:title" content="لعبة الذاكرة">
<meta property="og:description" content="طابِق كل الأزواج بأقل المحاولات.">
<meta property="og:image" content="https://d8j0ntlcm91z4.cloudfront.net/user_3Gqr8cNvaHecl4CfmnUHSrGscwp/hf_20260916_153610_dfd30354-f914-4b0d-a863-cec1ecc4c85c.png">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<style>
  .hud{display:flex;gap:12px;align-items:center;justify-content:center;margin-bottom:16px;flex-wrap:wrap}
  .score{background:var(--card2);border:1px solid var(--line2);border-radius:12px;padding:8px 18px;text-align:center;min-width:88px}
  .score .l{color:var(--muted);font-size:12px;font-weight:700}
  .score .v{font-family:"Baloo Bhaijaan 2",sans-serif;font-size:22px;color:#fff}
  .mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;width:min(92vw,440px);margin-inline:auto}
  .mcard{aspect-ratio:1;border-radius:14px;cursor:pointer;position:relative;perspective:600px}
  .inner{position:absolute;inset:0;transition:transform .35s;transform-style:preserve-3d}
  .mcard.flip .inner,.mcard.done .inner{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;border-radius:14px;display:flex;align-items:center;justify-content:center;backface-visibility:hidden;font-size:clamp(26px,8vw,42px)}
  .front{background:linear-gradient(135deg,var(--p1),var(--p2));box-shadow:inset 0 0 0 2px rgba(255,255,255,.15)}
  .front::after{content:"🍀";opacity:.85}
  .back{background:var(--card2);border:2px solid var(--line2);transform:rotateY(180deg)}
  .mcard.done .back{border-color:var(--green);box-shadow:0 0 16px rgba(52,211,153,.5)}
  .overlay{position:fixed;inset:0;background:rgba(20,11,46,.86);display:none;align-items:center;justify-content:center;z-index:9999}
  .overlay.show{display:flex}
  .win{background:var(--card);border:1px solid var(--line2);border-radius:20px;padding:28px 34px;text-align:center}
  .win h2{font-family:"Baloo Bhaijaan 2",sans-serif;color:#fff;font-size:28px;margin:0 0 8px}
  .win p{color:var(--muted);margin:0 0 16px}
</style>
</head>
<body>

<header class="top">
  <div class="wrap mast">
    <a href="index.html" class="brand"><span class="mk"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="4"/><path d="M7 12h4M9 10v4"/><circle cx="16" cy="11" r="1"/><circle cx="18.5" cy="13.5" r="1"/></svg></span><span class="word">محظوظ</span></a>
    <nav class="nav"><a href="index.html">الرئيسية</a><a href="word.html">كلمة اليوم</a><a href="game2048.html">2048</a></nav>
    <span class="grow"></span>
  </div>
</header>

<main class="gamewrap">
  <div class="crumbs"><a href="index.html">الرئيسية</a> ← ألعاب ذاكرة ← لعبة الذاكرة</div>
  <div class="gtitle"><h1>لعبة الذاكرة 🧠</h1><p>اقلب البطاقات وطابِق كل الأزواج</p></div>

  <div class="ad ad-lead"><span class="lbl">مساحة إعلانية</span></div>

  <div class="hud">
    <div class="score"><div class="l">المحاولات</div><div class="v" id="moves">0</div></div>
    <div class="score"><div class="l">الوقت</div><div class="v" id="time">0:00</div></div>
    <div class="score"><div class="l">الأزواج</div><div class="v" id="pairs">0/8</div></div>
    <button class="btn" id="newBtn">لعبة جديدة</button>
  </div>

  <div class="mgrid" id="mgrid"></div>
</main>

<div class="overlay" id="ov"><div class="win"><h2 id="wt">🎉 أحسنت!</h2><p id="wp"></p><button class="btn" id="ovBtn">العب مجدداً</button></div></div>

<footer class="foot"><div class="fine">© <span id="yr"></span> محظوظ (ma7zooz.com)</div></footer>

<script>
document.getElementById('yr').textContent=new Date().getFullYear();
(function(){
  "use strict";
  var EMO=["🍀","🎲","🎯","🎮","🏆","⭐","🚀","🍉"];
  var grid=document.getElementById('mgrid'), movesEl=document.getElementById('moves'), timeEl=document.getElementById('time'), pairsEl=document.getElementById('pairs');
  var first=null, lock=false, moves=0, matched=0, started=false, t0=0, timer=null;
  function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var tmp=a[i];a[i]=a[j];a[j]=tmp;} return a; }
  function fmt(s){ var m=Math.floor(s/60), ss=s%60; return m+':'+(ss<10?'0':'')+ss; }
  function tick(){ timeEl.textContent=fmt(Math.floor((Date.now()-t0)/1000)); }
  function start(){
    clearInterval(timer); started=false; moves=0; matched=0; first=null; lock=false;
    movesEl.textContent='0'; timeEl.textContent='0:00'; pairsEl.textContent='0/8'; document.getElementById('ov').classList.remove('show');
    var deck=shuffle(EMO.concat(EMO));
    grid.innerHTML='';
    deck.forEach(function(sym){
      var card=document.createElement('div'); card.className='mcard';
      card.innerHTML='<div class="inner"><div class="face front"></div><div class="face back">'+sym+'</div></div>';
      card.dataset.sym=sym;
      card.addEventListener('click',function(){ flip(card); });
      grid.appendChild(card);
    });
  }
  function flip(card){
    if(lock||card.classList.contains('flip')||card.classList.contains('done'))return;
    if(!started){ started=true; t0=Date.now(); timer=setInterval(tick,1000); }
    card.classList.add('flip');
    if(!first){ first=card; return; }
    moves++; movesEl.textContent=moves;
    if(first.dataset.sym===card.dataset.sym){
      first.classList.add('done'); card.classList.add('done'); first=null; matched++; pairsEl.textContent=matched+'/8';
      if(matched===8){ clearInterval(timer); setTimeout(win,400); }
    } else {
      lock=true; var a=first, b=card; first=null;
      setTimeout(function(){ a.classList.remove('flip'); b.classList.remove('flip'); lock=false; },700);
    }
  }
  function win(){ document.getElementById('wp').textContent='أنهيتها في '+moves+' محاولة و '+timeEl.textContent+' دقيقة'; document.getElementById('ov').classList.add('show'); }
  document.getElementById('newBtn').addEventListener('click',start);
  document.getElementById('ovBtn').addEventListener('click',start);
  start();
})();
</script>
</body>
</html>
