<style>
  .hud{display:flex;gap:10px;align-items:center;justify-content:center;margin-bottom:16px;flex-wrap:wrap}
  .score{background:var(--card2);border:1px solid var(--line2);border-radius:12px;padding:7px 16px;text-align:center;min-width:82px}
  .score .l{color:var(--muted);font-size:12px;font-weight:700}
  .score .v{font-family:"Baloo Bhaijaan 2",sans-serif;font-size:20px;color:#fff}
  .stage{width:min(94vw,420px);margin:0 auto}
  canvas{width:100%;aspect-ratio:.66;display:block;background:#1a1140;border:3px solid var(--p1);border-radius:16px;touch-action:none}
  .ctrls{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(94vw,420px);margin:16px auto 0}
  .ctrls button{background:var(--card2);border:1px solid var(--line2);color:#fff;font-size:26px;padding:16px 0;border-radius:14px;cursor:pointer}
  .ctrls button:active{background:linear-gradient(135deg,var(--p1),var(--p2))}
  .hint{text-align:center;color:var(--dim);font-size:13px;margin-top:10px}
  .overlay{position:fixed;inset:0;background:rgba(20,11,46,.88);display:none;align-items:center;justify-content:center;z-index:9999}
  .overlay.show{display:flex}
  .win{background:var(--card);border:1px solid var(--line2);border-radius:20px;padding:28px 34px;text-align:center;max-width:90vw}

  .win p{color:var(--muted);margin:0 0 16px}
  @media(min-width:760px){.ctrls{display:none}}

<main class="gamewrap">
  <div class="crumbs"><a href="index.html">الرئيسية</a> ← سباق ← سباق سريع</div>
  <div class="gtitle"><h1>سباق سريع 🏎️</h1><p>بدّل المسارات وتفادَ السيارات القادمة — كم مسافة تقطع؟</p></div>

  <div class="ad ad-lead"><span class="lbl">مساحة إعلانية</span></div>

  <div class="hud">
    <div class="score"><div class="l">النقاط</div><div class="v" id="sc">0</div></div>
    <div class="score"><div class="l">الأفضل</div><div class="v" id="best">0</div></div>
    <button class="btn" id="newBtn">لعبة جديدة</button>
  </div>

  <div class="stage"><canvas id="cv" width="300" height="454"></canvas></div>

  <div class="ctrls">
    <button id="right">▶</button>
    <button id="left">◀</button>
  </div>
  <p class="hint">اضغط يمين/يسار الشاشة أو استخدم الأسهم أو الأزرار للتحكّم</p>
</main>

<div class="overlay" id="ov"><div class="win"><h2>💥 اصطدمت!</h2><p id="wp"></p><button class="btn" id="ovBtn">العب مجدداً</button></div></div>

<footer class="foot"><div class="fine">© <span id="yr"></span> محظوظ (ma7zooz.com)</div></footer>

<script>
document.getElementById('yr').textContent=new Date().getFullYear();
(function(){
  "use strict";
  var cv=document.getElementById('cv'), ctx=cv.getContext('2d'), W=cv.width, H=cv.height;
  var LANES=3, laneW=W/LANES, scEl=document.getElementById('sc'), bestEl=document.getElementById('best');
  var player, obstacles, score, speed, spawnT, raf, running, dashOff;
  var best=0; try{ best=parseInt(localStorage.getItem('ma7zooz_dodge_best')||'0',10)||0; }catch(e){}
  bestEl.textContent=best;
  var carW=laneW*0.56, carH=carW*1.7;

  function laneX(l){ return l*laneW+(laneW-carW)/2; }
  function reset(){
    player={lane:1}; obstacles=[]; score=0; speed:0; speed=3.2; spawnT=0; dashOff=0; running=true;
    scEl.textContent='0'; document.getElementById('ov').classList.remove('show');
    cancelAnimationFrame(raf); loop();
  }
  function move(dir){ if(!running)return; player.lane=Math.max(0,Math.min(LANES-1,player.lane+dir)); }
  function spawn(){
    var lane=Math.floor(Math.random()*LANES);
    obstacles.push({lane:lane,y:-carH,col:['#f472b6','#22d3ee','#fb923c','#34d399'][Math.floor(Math.random()*4)]});
  }
  function loop(){
    ctx.clearRect(0,0,W,H);
    // road dashes
    dashOff=(dashOff+speed)%40;
    ctx.strokeStyle='rgba(255,255,255,.18)'; ctx.lineWidth=4; ctx.setLineDash([18,22]);
    for(var l=1;l<LANES;l++){ ctx.beginPath(); ctx.lineDashOffset=-dashOff; ctx.moveTo(l*laneW,0); ctx.lineTo(l*laneW,H); ctx.stroke(); }
    ctx.setLineDash([]);
    // spawn
    spawnT-=speed; if(spawnT<=0){ spawn(); spawnT=carH*1.7+Math.random()*120; }
    // player
    var px=laneX(player.lane), py=H-carH-14;
    // obstacles
    for(var i=obstacles.length-1;i>=0;i--){
      var o=obstacles[i]; o.y+=speed;
      drawCar(laneX(o.lane),o.y,o.col);
      if(o.y>H){ obstacles.splice(i,1); score++; scEl.textContent=score; if(score%8===0)speed+=0.5; continue; }
      if(o.lane===player.lane && o.y+carH>py+8 && o.y<py+carH-8){ return over(); }
    }
    drawCar(px,py,'#fde047');
    if(running) raf=requestAnimationFrame(loop);
  }
  function drawCar(x,y,col){
    ctx.fillStyle=col; rr(x,y,carW,carH,8); ctx.fill();
    ctx.fillStyle='rgba(20,11,46,.55)'; rr(x+carW*0.16,y+carH*0.16,carW*0.68,carH*0.24,4); ctx.fill();
    rr(x+carW*0.16,y+carH*0.6,carW*0.68,carH*0.22,4); ctx.fill();
  }
  function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  function over(){
    running=false; cancelAnimationFrame(raf);
    if(score>best){ best=score; bestEl.textContent=best; try{localStorage.setItem('ma7zooz_dodge_best',best);}catch(e){} }
    document.getElementById('wp').textContent='نقاطك: '+score+' · الأفضل: '+best;
    document.getElementById('ov').classList.add('show');
  }
  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowLeft'){ move(-1); e.preventDefault(); } else if(e.key==='ArrowRight'){ move(1); e.preventDefault(); }
  });
  document.getElementById('left').addEventListener('click',function(){ move(-1); });
  document.getElementById('right').addEventListener('click',function(){ move(1); });
  cv.addEventListener('touchstart',function(e){ e.preventDefault(); var r=cv.getBoundingClientRect(); var x=e.touches[0].clientX-r.left; if(x<r.width/2) move(-1); else move(1); },{passive:false});
  cv.addEventListener('mousedown',function(e){ var r=cv.getBoundingClientRect(); if((e.clientX-r.left)<r.width/2) move(-1); else move(1); });
  document.getElementById('newBtn').addEventListener('click',reset);
  document.getElementById('ovBtn').addEventListener('click',reset);
  reset();
})();
</script>
</body>
