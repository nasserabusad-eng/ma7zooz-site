<!DOCTYPE html>

<link rel="stylesheet" href="assets/styles.css">
<style>
  .hud{display:flex;gap:10px;align-items:center;justify-content:center;margin-bottom:16px;flex-wrap:wrap}
  .score{background:var(--card2);border:1px solid var(--line2);border-radius:12px;padding:7px 16px;text-align:center;min-width:82px}
  .score .l{color:var(--muted);font-size:12px;font-weight:700}
  .score .v{font-family:"Baloo Bhaijaan 2",sans-serif;font-size:20px;color:#fff}
  .stage{width:min(94vw,460px);margin:0 auto;position:relative}
  canvas{width:100%;aspect-ratio:1;display:block;background:var(--card);border:3px solid var(--p1);border-radius:16px;touch-action:none}
  .dpad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(3,64px);gap:8px;justify-content:center;margin:18px auto 0}
  .dpad button{background:var(--card2);border:1px solid var(--line2);color:#fff;font-size:24px;border-radius:14px;cursor:pointer}
  .dpad button:active{background:linear-gradient(135deg,var(--p1),var(--p2))}
  .dpad .up{grid-column:2;grid-row:1}.dpad .left{grid-column:3;grid-row:2}.dpad .right{grid-column:1;grid-row:2}.dpad .down{grid-column:2;grid-row:3}
  .hint{text-align:center;color:var(--dim);font-size:13px;margin-top:10px}
  .overlay{position:fixed;inset:0;background:rgba(20,11,46,.88);display:none;align-items:center;justify-content:center;z-index:9999}
  .overlay.show{display:flex}
  .win{background:var(--card);border:1px solid var(--line2);border-radius:20px;padding:28px 34px;text-align:center;max-width:90vw}
  .win h2{font-family:"Baloo Bhaijaan 2",sans-serif;color:#fff;font-size:28px;margin:0 0 8px}
  .win p{color:var(--muted);margin:0 0 16px}
  @media(min-width:760px){.dpad{display:none}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap mast">
    <a href="index.html" class="brand"><span class="mk"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="4"/><path d="M7 12h4M9 10v4"/><circle cx="16" cy="11" r="1"/><circle cx="18.5" cy="13.5" r="1"/></svg></span><span class="word">محظوظ</span></a>
    <nav class="nav"><a href="index.html">الرئيسية</a><a href="word.html">كلمة اليوم</a><a href="game2048.html">2048</a></nav>
    <span class="grow"></span>
  </div>
</header>

<main class="gamewrap">
  <div class="crumbs"><a href="index.html">الرئيسية</a> ← أركيد ← الأفعى</div>
  <div class="gtitle"><h1>الأفعى 🐍</h1><p>وجّه الأفعى لالتهام النقاط دون أن تصطدم بنفسها أو بالحائط</p></div>

  <div class="ad ad-lead"><span class="lbl">مساحة إعلانية</span></div>

  <div class="hud">
    <div class="score"><div class="l">النقاط</div><div class="v" id="sc">0</div></div>
    <div class="score"><div class="l">الأفضل</div><div class="v" id="best">0</div></div>
    <button class="btn" id="newBtn">لعبة جديدة</button>
  </div>

  <div class="stage"><canvas id="cv" width="400" height="400"></canvas></div>

  <div class="dpad">
    <button class="up" data-d="U">▲</button>
    <button class="right" data-d="R">▶</button>
    <button class="left" data-d="L">◀</button>
    <button class="down" data-d="D">▼</button>
  </div>
  <p class="hint">اسحب على اللوحة أو استخدم الأسهم / الأزرار للتحكّم</p>
</main>

<div class="overlay" id="ov"><div class="win"><h2>💥 انتهت اللعبة</h2><p id="wp"></p><button class="btn" id="ovBtn">العب مجدداً</button></div></div>

<footer class="foot"><div class="fine">© <span id="yr"></span> محظوظ (ma7zooz.com)</div></footer>

<script>
document.getElementById('yr').textContent=new Date().getFullYear();
(function(){
  "use strict";
  var N=20, cv=document.getElementById('cv'), ctx=cv.getContext('2d');
  var scEl=document.getElementById('sc'), bestEl=document.getElementById('best');
  var snake, dir, nextDir, food, score, speed, loop, dead;
  var best=0; try{ best=parseInt(localStorage.getItem('ma7zooz_snake_best')||'0',10)||0; }catch(e){}
  bestEl.textContent=best;
  var cell=cv.width/N;

  function rndFood(){ var f; do{ f={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}; }while(snake.some(function(s){return s.x===f.x&&s.y===f.y;})); food=f; }
  function reset(){
    snake=[{x:9,y:10},{x:8,y:10},{x:7,y:10}]; dir={x:1,y:0}; nextDir=dir; score=0; speed=130; dead=false;
    scEl.textContent='0'; document.getElementById('ov').classList.remove('show'); rndFood();
    clearInterval(loop); loop=setInterval(step,speed); draw();
  }
  function setDir(d){
    var nd=null;
    if(d==='U'&&dir.y!==1)nd={x:0,y:-1}; else if(d==='D'&&dir.y!==-1)nd={x:0,y:1};
    else if(d==='L'&&dir.x!==1)nd={x:-1,y:0}; else if(d==='R'&&dir.x!==-1)nd={x:1,y:0};
    if(nd)nextDir=nd;
  }
  function step(){
    dir=nextDir;
    var head={x:snake[0].x+dir.x, y:snake[0].y+dir.y};
    if(head.x<0||head.y<0||head.x>=N||head.y>=N||snake.some(function(s){return s.x===head.x&&s.y===head.y;})){ return over(); }
    snake.unshift(head);
    if(head.x===food.x&&head.y===food.y){ score++; scEl.textContent=score; rndFood();
      if(score%5===0&&speed>60){ speed-=10; clearInterval(loop); loop=setInterval(step,speed); } }
    else snake.pop();
    draw();
  }
  function draw(){
    ctx.clearRect(0,0,cv.width,cv.height);
    // food
    ctx.fillStyle='#fde047'; roundRect(food.x*cell+2,food.y*cell+2,cell-4,cell-4,4); ctx.fill();
    // snake
    for(var i=0;i<snake.length;i++){
      ctx.fillStyle=i===0?'#f472b6':'#a855f7';
      roundRect(snake[i].x*cell+1.5,snake[i].y*cell+1.5,cell-3,cell-3,4); ctx.fill();
    }
  }
  function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  function over(){
    clearInterval(loop); dead=true;
    if(score>best){ best=score; bestEl.textContent=best; try{localStorage.setItem('ma7zooz_snake_best',best);}catch(e){} }
    document.getElementById('wp').textContent='نقاطك: '+score+' · الأفضل: '+best;
    document.getElementById('ov').classList.add('show');
  }
  document.addEventListener('keydown',function(e){
    var k=e.key; if(k==='ArrowUp'||k==='w')setDir('U'); else if(k==='ArrowDown'||k==='s')setDir('D');
    else if(k==='ArrowLeft')setDir('L'); else if(k==='ArrowRight')setDir('R'); else return; e.preventDefault();
  });
  document.querySelectorAll('.dpad button').forEach(function(b){ b.addEventListener('click',function(){ setDir(b.dataset.d); }); });
  // swipe
  var sx=0,sy=0;
  cv.addEventListener('touchstart',function(e){ var t=e.touches[0]; sx=t.clientX; sy=t.clientY; },{passive:true});
  cv.addEventListener('touchmove',function(e){ e.preventDefault();
    var t=e.touches[0], dx=t.clientX-sx, dy=t.clientY-sy;
    if(Math.abs(dx)<18&&Math.abs(dy)<18)return;
    if(Math.abs(dx)>Math.abs(dy)){ setDir(dx>0?'R':'L'); } else { setDir(dy>0?'D':'U'); }
    sx=t.clientX; sy=t.clientY;
  },{passive:false});
  document.getElementById('newBtn').addEventListener('click',reset);
  document.getElementById('ovBtn').addEventListener('click',reset);
  reset();
})();
</script>
</body>
</html>
